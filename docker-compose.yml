services:
  db:
    image: mysql:8.0
    container_name: rubrix_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_here}
      MYSQL_DATABASE: ${MYSQL_DB:-rubrikrks}
      MYSQL_USER: ${MYSQL_USER:-rubrikrks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rubrikrks_prod_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    # No host ports exposed: the DB is only reachable inside the Docker network.

  web:
    build: .
    container_name: rubrix_web
    restart: always
    ports:
      - "80:5000"
    environment:
      RKS_SECRET_KEY: ${RKS_SECRET_KEY:-change-me-to-a-long-random-string}
      RKS_PORT: "5000"
      RKS_DB_ENGINE: mysql
      RKS_MYSQL_HOST: db
      RKS_MYSQL_PORT: "3306"
      RKS_MYSQL_USER: ${MYSQL_USER:-rubrikrks}
      RKS_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rubrikrks_prod_password}
      RKS_MYSQL_DB: ${MYSQL_DB:-rubrikrks}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
